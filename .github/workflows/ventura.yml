name: Ventura backport

on:
  push:
    branches: [ventura-support]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ventura-${{ github.ref }}
  cancel-in-progress: true

# Use an Intel build host with a fixed compiler; the resulting app targets Ventura.
env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  test:
    name: Intel tests
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Run core and standalone tests
        shell: bash
        run: |
          set -o pipefail
          scripts/test.sh 2>&1 | tee ventura-tests.log
      - name: Keep test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ventura-test-diagnostics
          path: |
            ventura-tests.log
            Packages/CraCore/Package.resolved
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Intel app for Ventura
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain and CMake
        run: |
          xcodebuild -version
          swift --version
          command -v cmake || brew install cmake
      - name: Cache pinned frameworks
        uses: actions/cache@v6
        with:
          path: |
            vendor/cef
            vendor/sparkle
          key: ventura-intel-${{ hashFiles('scripts/fetch-cef.sh', 'scripts/fetch-sparkle.sh') }}
      - name: Build experimental app
        shell: bash
        env:
          CRA_ARCH: x86_64
          CRA_VERSION: 0.0.0-ventura
          CRA_RELEASE: '0'
        run: |
          set -o pipefail
          scripts/build.sh debug 2>&1 | tee ventura-build.log
      - name: Verify signature and deployment requirements
        run: |
          codesign --verify --deep --strict --verbose=2 build/Cra.app
          python3 scripts/verify-ventura-bundle.py build/Cra.app
      - name: Package app
        run: |
          mkdir -p build/ventura-dist
          ditto -c -k --keepParent build/Cra.app build/ventura-dist/Cra-Ventura-Intel.zip
          (cd build/ventura-dist && shasum -a 256 Cra-Ventura-Intel.zip > SHA256SUMS.txt)
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Experimental Intel Ventura build
          Download `Cra-Ventura-Intel` below and extract its app ZIP on Ventura.
          This app is ad-hoc signed and is not notarized. It has no upstream auto-update feed.
          Test it with a disposable profile before using your existing browser data.
          Compilation and deployment checks do not replace runtime testing on macOS 13.
          Test results are reported separately by the Intel tests job.
          SUMMARY
      - name: Keep app
        uses: actions/upload-artifact@v7
        with:
          name: Cra-Ventura-Intel
          path: build/ventura-dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Keep build diagnostics and dependency resolution
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ventura-build-diagnostics
          path: |
            ventura-build.log
            Package.resolved
          if-no-files-found: ignore
          retention-days: 14
